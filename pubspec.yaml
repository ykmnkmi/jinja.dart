name: jinja
version: 0.6.7
description: >-
  Jinja2 template engine for Dart.
  Variables, expressions, control structures and template inheritance.
repository: https://github.com/ykmnkmi/jinja.dart

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  html_unescape: ^2.0.0
  meta: ^1.18.2
  path: ^1.9.1
  string_scanner: ^1.4.1
  textwrap: ^2.2.0

dev_dependencies:
  benchmark_harness: ^2.4.0
  lints: ^6.1.0
  test: ^1.31.1
